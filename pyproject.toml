[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-guardrails-harness"
version = "1.0.0"
description = "LLM evaluation and guardrails: deterministic checks, validated judges, paired regression gating, fail-closed runtime rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raghav Banuni" }]
keywords = ["llm", "evaluation", "guardrails", "llm-as-judge", "mcnemar", "pii", "prompt-injection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
llmeval = "llmeval.cli:main"

[tool.setuptools]
packages = ["llmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
